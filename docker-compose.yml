services:

  seshat:
    build: .
    command: npm run dev
    environment:
      S3_ENDPOINT: http://garage:3900
      # Presigned URLs are consumed by the client, not by this process, so they
      # must be signed against an address the client can actually reach - the
      # signature covers the Host header, so the two cannot differ.
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
    ports:
      - 3000:3000
    volumes:
      - ./src:/home/app/src
      - ./examples:/home/app/examples
      - ./tmp:/home/app/tmp

  garage:
    image: dxflrs/garage:v2.4.1
    # Lays out the single node, imports the key below and creates the bucket
    # with read/write access for it. All three are idempotent across restarts.
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    ports:
      # The S3 API is published on 9000 so that the examples' default endpoint
      # and the presigned URLs (see S3_PUBLIC_ENDPOINT) reach it from the host.
      - 9000:3900
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: access-key
      GARAGE_DEFAULT_SECRET_KEY: garage-dev-secret-key
      GARAGE_DEFAULT_BUCKET: my-s3-bucket
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - ./volumes/garage:/var/lib/garage

  gcs:
    image: fsouza/fake-gcs-server
    command: ["-scheme", "http"]
    ports:
      - 4443:4443
    volumes:
      - ./volumes/gcs:/data

  clamav:
    # clamav only publishes amd64 images; pinning the platform lets the
    # integration tests run under emulation on arm64 hosts (Apple Silicon).
    platform: linux/amd64
    image: clamav/clamav:1.5.1

